[package]
name = "album-studio"
version = "1.0.0"
edition = "2021"

[dependencies]
eframe = "0.29"
rfd = "0.15"
image = { version = "0.25.5", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp", "tiff"] }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
